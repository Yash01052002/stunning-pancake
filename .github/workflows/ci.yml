name: CI

on:
  push:
    branches: [Master]
  pull_request:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The suite runs against in-memory SQLite and injects fakes for the
        # LLM / email / Slack integrations, so no external services or secrets
        # are required.
        run: python -m pytest -q
